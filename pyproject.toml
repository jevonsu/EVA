[project]
name = "eva"
version = "0.1.5"
description = "Eva local AI assistant: FastAPI web UI, tools, memory, scheduler, MCP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.0",
    "openai>=1.55.0",
    "httpx>=0.27.0",
    "apscheduler>=3.10.4",
    "mcp>=1.2.0",
    "aiofiles>=24.1.0",
    "orjson>=3.10.0",
    "bcrypt>=4.2.0",
    "cryptography>=43.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "httpx>=0.27.0"]

[project.scripts]
eva = "app.main:run"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
