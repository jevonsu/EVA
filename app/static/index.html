<!DOCTYPE html>
<html lang="zh-HK">
<head>
 <meta charset="UTF-8" />
 <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
 <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
 <meta name="theme-color" content="#171717" />
 <meta name="apple-mobile-web-app-capable" content="yes" />
 <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
 <meta name="mobile-web-app-capable" content="yes" />
 <meta name="format-detection" content="telephone=no" />
 <meta name="renderer" content="webkit" />
 <meta name="force-rendering" content="webkit" />
 <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
 <title>AI 助手</title>
 <link rel="icon" type="image/png" href="/static/logo.png" />
 <link rel="stylesheet" href="/static/css/base.css" />
 <link rel="stylesheet" href="/static/css/sidebar.css" />
 <link rel="stylesheet" href="/static/css/messages.css" />
 <link rel="stylesheet" href="/static/css/modals.css" />
 <link rel="stylesheet" href="/static/css/mobile.css" />
 <link rel="stylesheet" href="/static/css/llama-theme.css" />
 <style>
 /* 先 100vh 再 100dvh：旧 WebView 不识别 dvh 时仍有可用高度，避免首屏 height 失效 */
 :root { --app-height: 100vh; }
 @supports (height: 100dvh) {
  :root { --app-height: 100dvh; }
 }
 html, body {
  height: var(--app-height, 100vh);
  max-height: var(--app-height, 100vh);
  overflow: hidden;
 }
 /* composer 位置由 messages.css / mobile.css 控制（主页 absolute / 对话 grid 底栏） */
 </style>
</head>
<body>
 <!-- Toast 容器 -->
 <div id="toastContainer" class="toast-container"></div>

 <div class="app">
 <aside class="sidebar">
 <div class="brand">
 <div class="logo logo-img" aria-hidden="true"><img src="/static/logo.png" alt="" /></div>
 <div>
 <div class="brand-title" id="agentName">Eva</div>
 <div class="brand-sub" id="agentMeta">加载中…</div>
 </div>
 </div>

 <button type="button" class="btn primary full icon-inline" id="btnNewChat"><span data-ipk="comment" data-ipk-class="ipk-sm"></span> 新对话</button>
 <button type="button" class="btn full icon-inline" id="btnOpenConfig"><span data-ipk="setting-two" data-ipk-class="ipk-sm"></span> 设定</button>

 <div class="quick-row">
 <button type="button" class="btn ghost-sm icon-inline" id="btnQuickTasks" title="打开任务"><span data-ipk="alarm-clock" data-ipk-class="ipk-xs"></span> 任务</button>
 <button type="button" class="btn ghost-sm icon-inline" id="btnQuickMemory" title="打开记忆"><span data-ipk="brain" data-ipk-class="ipk-xs"></span> 记忆</button>
 <button type="button" class="btn ghost-sm icon-inline" id="btnQuickKb" title="打开知识库"><span data-ipk="book-open" data-ipk-class="ipk-xs"></span> 知识库</button>
 <button type="button" class="btn ghost-sm icon-inline" id="btnQuickWorkspace" title="打开工作区"><span data-ipk="folder-open" data-ipk-class="ipk-xs"></span> 工作区</button>
 </div>

 <div class="section-label icon-inline"><span data-ipk="list" data-ipk-class="ipk-xs"></span> 对话纪录</div>
 <div class="session-search-wrap">
 <input type="search" id="sessionSearch" class="session-search" placeholder="搜索标题或正文…" autocomplete="off" />
 </div>
 <div class="session-list" id="sessionList"></div>

 <div class="sidebar-footer">
 <div class="sidebar-brand-mark" title="Ruyi Studio">
  <span class="sidebar-brand-label">Powered by</span>
  <span class="sidebar-brand-name">Ruyi Studio</span>
 </div>
 </div>
 </aside>

 <main class="main">
 <header class="topbar">
 <div class="topbar-left">
 <button type="button" class="btn icon-btn" id="btnMenu" title="菜单" aria-label="菜单" aria-expanded="true" aria-controls="sessionList"><span data-ipk="hamburger-button" data-ipk-class="ipk-md"></span></button>
 <div>
 <h1 id="chatTitle" class="icon-inline"><span data-ipk="comment" data-ipk-class="ipk-sm"></span> <span id="chatTitleText">新对话</span></h1>
 <p class="hint" id="sessionHint">输入消息开始对话</p>
 </div>
 </div>
 <div class="top-actions">
 <!-- 工具 / 记忆默认开启，界面不展示开关；保留隐藏 checkbox 供逻辑读取 -->
 <input type="checkbox" id="useTools" class="sr-only" checked tabindex="-1" aria-hidden="true" />
 <input type="checkbox" id="useMemory" class="sr-only" checked tabindex="-1" aria-hidden="true" />
 <span class="hint-chip top-hint-chip is-idle" id="voiceHint" hidden title="连续听写：点一次开始、再点停止。识别语言跟随设定→人设→语言（粤语/普通话/英语；「跟随用户」时才自动切换）。建议 Chrome/Edge">语音：待机</span>
 <button type="button" class="hint-chip top-hint-chip mode-chip" id="modeHint" title="点一下切换：工具开启=可调用技能（完整回复）；关闭=流式回复。">模式：工具开启 · 完整回复</button>
 </div>
 </header>

 <div class="messages-wrap">
 <section class="messages" id="messages" aria-live="polite"></section>
 <button type="button" class="scroll-bottom hidden icon-inline" id="btnScrollBottom" title="回到底部" aria-label="回到底部"><span data-ipk="to-bottom" data-ipk-class="ipk-xs"></span> 最新</button>
 </div>

 <footer class="composer" id="composer">
 <!-- 空会话：产品名；左上角才是用户给 Agent 的名字。没模型时引导去添加 -->
 <div class="home-hero-head" id="homeHeroHead" hidden>
  <h2 class="home-hero-title" id="homeHeroTitle">EVA System OS</h2>
  <p class="home-hero-sub" id="homeHeroSub">有什么可以帮你的？</p>
 </div>
 <div class="home-setup hidden" id="homeSetup">
  <p class="home-setup-title">还没有对话模型</p>
  <p class="home-setup-hint">先添加一个本地或云端模型，才能开始聊天。</p>
  <button type="button" class="btn primary icon-inline" id="btnHomeAddLlm">
   <span data-ipk="lightning" data-ipk-class="ipk-xs"></span> 添加模型
  </button>
 </div>
 <div class="attach-bar hidden" id="attachBar" aria-live="polite">
 <div class="attach-list" id="attachList"></div>
 </div>
 <!-- 上传 / 选用已有 uploads：顶置筛选 · 方块网格（首格上传） -->
 <div class="upload-picker hidden" id="uploadPicker" role="dialog" aria-label="选择或上传文件">
 <div class="upload-picker-filters" id="uploadPickerFilters">
 <button type="button" class="up-filter is-active" data-up-filter="all">全部</button>
 <button type="button" class="up-filter" data-up-filter="image">图片</button>
 <button type="button" class="up-filter" data-up-filter="video">视频</button>
 <button type="button" class="up-filter" data-up-filter="file">其他</button>
 </div>
 <div class="upload-picker-grid" id="uploadPickerGrid"></div>
 </div>
 <div class="composer-shell">
 <div class="composer-box" id="composerBox">
 <input
 type="file"
 id="fileInput"
 class="file-input-hidden"
 multiple
 accept="image/*,video/*,audio/*,.pdf,.txt,.md,.csv,.json,.xlsx,.xls,.docx,.pptx,.zip"
 />
 <textarea
 id="input"
 rows="1"
 placeholder="有什么可以帮你的？"
 enterkeyhint="send"
 autocomplete="off"
 autocapitalize="sentences"
 autocorrect="on"
 spellcheck="true"
 ></textarea>
 <div class="composer-toolbar" role="toolbar" aria-label="输入工具">
 <div class="composer-toolbar-left">
 <div class="composer-plus-wrap" id="composerPlusWrap">
 <button type="button" class="btn composer-icon-btn" id="btnComposerPlus" title="添加" aria-label="添加" aria-haspopup="menu" aria-expanded="false" aria-controls="composerPlusMenu"><span class="ci" data-ipk="plus" data-ipk-class="ipk-sm"></span></button>
 <div class="composer-plus-menu hidden" id="composerPlusMenu" role="menu">
 <button type="button" class="composer-plus-item" id="btnAttach" role="menuitem" title="上传或选用已有文件"><span data-ipk="paperclip" data-ipk-class="ipk-sm"></span><span>附件</span></button>
 <button type="button" class="composer-plus-item" id="btnVoice" role="menuitem" title="语音输入（跟随人设语言：粤语/普通话/英语）" aria-label="语音输入" aria-pressed="false"><span class="ci ci-mic" data-ipk="voice" data-ipk-class="ipk-sm"></span><span id="btnVoiceLabel">语音输入</span></button>
 <label class="composer-plus-item voice-meet-wrap" title="会议模式：连续听写、按句加时间戳，适合会议记录">
 <span data-ipk="people" data-ipk-class="ipk-sm"></span>
 <span class="voice-meet-label">会议模式</span>
 <input type="checkbox" id="voiceMeeting" />
 </label>
 </div>
 </div>
 </div>
 <div class="composer-toolbar-right">
 <button type="button" class="btn primary btn-send is-empty" id="btnSend" title="发送（Enter）" aria-label="发送">
  <span class="btn-send-face btn-send-face--go" aria-hidden="true">
   <span class="ci ci-send" data-ipk="send" data-ipk-class="ipk-sm"></span>
  </span>
  <span class="btn-send-face btn-send-face--stop" aria-hidden="true">
   <span class="btn-send-stop-sq"></span>
  </span>
  <span class="btn-send-label sr-only">发送</span>
 </button>
 </div>
 </div>
 </div>
 <div class="composer-meta">
 <div class="status" id="status"></div>
 </div>
 </div>
 <!-- 空会话快捷建议（居中模式挂在输入框下方） -->
 <div class="home-hero-chips hidden" id="homeHeroChips" aria-label="快速开始"></div>
 <div class="drop-overlay hidden" id="dropOverlay" aria-hidden="true">
 <div class="drop-overlay-inner">松开以上传到 workspace</div>
 </div>
 </footer>
 </main>
 </div>

 <div class="sidebar-scrim hidden" id="sidebarScrim"></div>

 <!-- Config Modal (? /static/html/config-modal.html ????)-->
 <div id="configModalContainer"></div>

<template id="skeletonTask">
 <div class="card skeleton">
 <div class="card-body">
 <div class="skeleton-line" style="width:60%"></div>
 <div class="skeleton-line" style="width:40%"></div>
 <div class="skeleton-line" style="width:80%"></div>
 </div>
 </div>
 </template>

 
 <!-- Config modal: async (do not block first paint with sync XHR) -->
 <script>
 window.__configModalReady = (function () {
  var p = fetch("/static/html/config-modal.html", { credentials: "same-origin" })
   .then(function (r) {
    if (!r.ok) throw new Error("config modal " + r.status);
    return r.text();
   })
   .then(function (html) {
    var c = document.getElementById("configModalContainer");
    if (c) c.innerHTML = html;
    return true;
   })
   .catch(function (e) {
    console.warn("Failed to load config modal:", e);
    return false;
   });
  return p;
 })();
 </script>

 <script defer src="/static/js/icons.js"></script>
 <script defer src="/static/js/app-core.js"></script>
 <script defer src="/static/js/app-render.js"></script>
 <script defer src="/static/js/app-chat.js"></script>
 <script defer src="/static/js/app-upload.js"></script>
 <script defer src="/static/js/app-voice.js"></script>
 <script defer src="/static/js/app-tts.js"></script>
 <script defer src="/static/js/app-panels.js"></script>
 <script defer src="/static/js/app-workspace.js"></script>
 <script defer src="/static/js/app-config.js"></script>
 <script defer src="/static/js/app-init.js"></script>
</body>
</html>
