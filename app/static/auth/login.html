<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex,nofollow" />
  <meta name="referrer" content="no-referrer" />
  <title>Eva · 卡密登录</title>
  <link rel="stylesheet" href="/static/auth/auth.css" />
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="brand">
        <div class="logo">E</div>
        <div>
          <h1>Eva 登录</h1>
          <p>使用发卡平台发放的卡密进入系统</p>
        </div>
      </div>

      <form id="loginForm" autocomplete="off" novalidate>
        <label for="card">卡密</label>
        <input
          id="card"
          name="card"
          type="text"
          inputmode="text"
          autocomplete="one-time-code"
          placeholder="EVA-XXXX-XXXX-XXXX-XXXX"
          maxlength="64"
          required
          spellcheck="false"
        />
        <!-- honeypot -->
        <div class="hp" aria-hidden="true">
          <label>website</label>
          <input id="website" name="website" type="text" tabindex="-1" autocomplete="off" />
        </div>

        <button class="btn primary" id="btnLogin" type="submit">进入系统</button>
        <div class="msg" id="msg" role="status"></div>
      </form>

      <div class="hint">
        · 卡密区分大小写，建议整段复制粘贴<br />
        · 连续失败将触发临时锁定<br />
        · 管理员入口：<a href="/admin">/admin</a>
      </div>
    </div>
  </div>
  <script src="/static/auth/login.js" defer></script>
</body>
</html>
