<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex,nofollow" />
  <meta name="theme-color" content="#171717" />
  <meta name="referrer" content="no-referrer" />
  <title>Eva · 登录</title>
  <link rel="icon" type="image/png" href="/static/logo.png" />
  <link rel="stylesheet" href="/static/auth/auth.css" />
  <link rel="stylesheet" href="/static/css/motion.css" />
</head>
<body class="login-body">
  <div class="login-bg" aria-hidden="true">
    <div class="login-orb login-orb-a"></div>
    <div class="login-orb login-orb-b"></div>
    <div class="login-grid"></div>
  </div>

  <div class="wrap">
    <div class="card login-card">
      <div class="brand">
        <div class="logo logo-img" aria-hidden="true"><img src="/static/logo.png" alt="" /></div>
        <div class="brand-text">
          <h1>Eva</h1>
          <p id="brandSub">账号密码登录</p>
        </div>
      </div>

      <form id="loginForm" class="login-form" autocomplete="on" novalidate>
        <div id="setupBanner" class="msg err hidden" role="status"></div>

        <div class="field">
          <div class="field-head">
            <label for="username">用户名</label>
          </div>
          <div class="input-row">
            <input
              id="username"
              name="username"
              type="text"
              autocomplete="username"
              placeholder="admin"
              maxlength="64"
              required
              spellcheck="false"
            />
          </div>
        </div>

        <div class="field">
          <div class="field-head">
            <label for="password">密码</label>
          </div>
          <div class="input-row">
            <input
              id="password"
              name="password"
              type="password"
              autocomplete="current-password"
              placeholder="至少 8 位"
              maxlength="200"
              required
              spellcheck="false"
            />
            <button
              type="button"
              class="btn ghost btn-inline"
              id="btnTogglePwd"
              title="显示或隐藏密码"
              aria-pressed="false"
            >显示</button>
          </div>
        </div>

        <div class="hp" aria-hidden="true">
          <label>website</label>
          <input id="website" name="website" type="text" tabindex="-1" autocomplete="off" />
        </div>

        <button class="btn primary btn-login" id="btnLogin" type="submit">
          <span class="btn-login-label" id="btnLoginLabel">登录</span>
        </button>
        <div class="msg" id="msg" role="status"></div>
      </form>

      <div id="pairPanel" class="pair-panel hidden">
        <p class="pair-title">登录成功 · 办公室连接码</p>
        <p class="pair-code" id="pairCode"></p>
        <p class="pair-hint">把这串码填进 Hub「添加员工」。30 分钟内一次性有效，用后作废。</p>
        <div class="pair-actions">
          <button type="button" class="btn ghost" id="btnCopyPair">复制</button>
          <button type="button" class="btn primary" id="btnEnterEva">进入 Eva</button>
        </div>
      </div>

      <p class="login-hint" id="loginHint">
        使用本机账号与密码登录。首次使用请创建管理员账号。
      </p>
    </div>
  </div>
  <script src="/static/auth/login.js?v=ux4" defer></script>
</body>
</html>
